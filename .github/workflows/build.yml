name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
      - name: Ekstrak proyek
        run: unzip -q SetelanPixel.zip
      - name: Build APK
        working-directory: SetelanPixel
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2g
      - uses: actions/upload-artifact@v4
        with:
          name: SetelanPixel-APK
          path: SetelanPixel/app/build/outputs/apk/debug/*.apk
